<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Passport Scanner</title>
    <style>
      body {
        font: 16px system-ui;
        max-width: 850px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      button,
      input {
        font: inherit;
        margin: 0.4rem;
        padding: 0.5rem;
      }
      img {
        max-width: 100%;
        max-height: 350px;
        object-fit: contain;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f3f3f3;
        padding: 1rem;
      }
      label {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Local Passport Scanner</h1>
    <p>
      Processing stays in this browser. Verify every field against the document
      before using it. Nothing is saved by this example.
    </p>
    <label
      >Photo (JPEG, PNG, WebP, HEIC/HEIF)<input
        id="photo"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif"
    /></label>
    <button id="synthetic">Use synthetic specimen</button
    ><button id="scan" disabled>Scan</button
    ><button id="cancel" disabled>Cancel</button
    ><button id="clear">Clear</button>
    <p id="status" role="status" aria-live="polite">Ready</p>
    <img id="preview" alt="Selected document preview" hidden />
    <pre id="result" aria-label="Recognition candidates"></pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
